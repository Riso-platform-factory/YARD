[package]
name = "riso_shell"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/riso_shell.rs"

[features]
default = ["dev"]
dev = ["riso_layout/dev", "riso_ui/dev"]

[dependencies]
gpui.workspace = true
riso_layout = { workspace = true, default-features = false }
riso_ui = { workspace = true, default-features = false }
log.workspace = true
tracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
