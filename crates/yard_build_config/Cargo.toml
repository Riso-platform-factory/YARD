[package]
name = "yard_build_config"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/yard_build_config.rs"

[features]
default = ["dev"]
# Compiles the parts that are not in production.
dev = ["yard_product/dev"]

[dependencies]
# `ico` for the `.exe`'s icon.
image = { workspace = true, features = ["png", "ico"] }
semver.workspace = true
toml.workspace = true
tracing.workspace = true
yard_product = { workspace = true, default-features = false }

# The Windows resource, with the icon and the version, compiled on Windows.
[target.'cfg(windows)'.dependencies]
embed-resource.workspace = true
