[package]
name = "settings_editor"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/settings_editor.rs"

[features]
default = ["dev"]
dev = ["yard_settings/dev", "yard_shell/dev", "yard_ui/dev"]

[dependencies]
gpui.workspace = true
serde_json.workspace = true
tracing.workspace = true
yard_settings = { workspace = true, default-features = false }
yard_shell = { workspace = true, default-features = false }
yard_ui = { workspace = true, default-features = false }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
log.workspace = true
schemars.workspace = true
serde.workspace = true
