[workspace]
resolver = "3"
members = ["crates/*", "app/*", "examples/*", "extensions/*", "tooling/*"]
default-members = ["app/yard"]
exclude = ["tooling/runner-checks"]

[workspace.package]
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37", default-features = false }
gpui_apple = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37", default-features = false, features = ["font-kit"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37", default-features = false, features = ["font-kit", "wayland", "x11"] }
ui = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37" }
theme = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37" }
http_client = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37" }
http_client_tls = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37" }
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37" }
zed-reqwest = { git = "https://github.com/zed-industries/reqwest.git", rev = "33bc764aa15ff7b200bf7c93bd96e24878d53e14", version = "0.12.15-zed", default-features = false }
zlog = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37" }
yard_data = { path = "crates/yard_data", default-features = false }
yard_http = { path = "crates/yard_http", default-features = false }
yard_i18n = { path = "crates/yard_i18n", default-features = false }
yard_layout = { path = "crates/yard_layout", default-features = false }
yard_state = { path = "crates/yard_state", default-features = false }
yard_shell = { path = "crates/yard_shell", default-features = false }
yard_log = { path = "crates/yard_log", default-features = false }
yard_product = { path = "crates/yard_product", default-features = false }
yard_paths = { path = "crates/yard_paths", default-features = false }
yard_ui = { path = "crates/yard_ui", default-features = false }
yard_settings = { path = "crates/yard_settings", default-features = false }
yard_keymap = { path = "crates/yard_keymap", default-features = false }
yard_update = { path = "crates/yard_update", default-features = false }
yard_app = { path = "crates/yard_app", default-features = false }
yard_test = { path = "crates/yard_test", default-features = false }
yard_build_config = { path = "crates/yard_build_config", default-features = false }
command_palette = { path = "extensions/command_palette", default-features = false }
settings_editor = { path = "extensions/settings_editor", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ctrlc = { version = "3.5.3", features = ["termination"] }
dirs = "6"
embed-resource = "3.0"
futures = "0.3"
image = { version = "0.25.1", default-features = false, features = ["png"] }
icu_locale_core = "2.4.0"
icu_plurals = "2.4.0"
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
log = "0.4.35"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false }
objc2-core-foundation = { version = "=0.3.2", default-features = false }
objc2-foundation = { version = "0.3.2", default-features = false }
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "SecBase", "SecItem"] }
oo7 = { git = "https://github.com/zed-industries/oo7", rev = "731c1215edb6905876c6137ab300428c7b8d7c13", version = "0.6.0", default-features = false }
rusqlite = { version = "0.43.0", features = ["bundled", "hooks"] }
tracing = "0.1.44"
tracing-core = "0.1.36"
tracing-log = { version = "0.2", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "env-filter"] }
windows = "0.62"
schemars = "1.2.3"
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sys-locale = "0.3.2"
sha2 = "0.10"
libc = "0.2"
tempfile = "3"
toml = "0.9"
unicode-segmentation = "1.13.3"
url = "2.5.8"
zeroize = "1.9.1"
