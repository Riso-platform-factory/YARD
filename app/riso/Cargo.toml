[package]
name = "riso"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["dev"]
dev = ["riso_log/dev", "dep:tracing", "dep:tempfile"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true

riso_log = { workspace = true, default-features = false, optional = true }
tracing = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[build-dependencies]
toml.workspace = true
