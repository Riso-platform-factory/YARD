# What the yard application is called and which version it is. Packaging may give
# another file with PRODUCT_CONFIG=<path> at build time.
name = "yard"
version = "0.1.0"
# The reverse-domain identifier, as macOS asks of a bundle identifier.
identifier = "vn.risotech.yard"
url_scheme = "yard"
# A square PNG of at least 512 × 512 pixels, relative to this file.
icon = "icon.png"
