[package]
name = "yard"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["dev"]
dev = ["yard_app/dev", "yard_product/dev", "yard_shell/dev", "command_palette/dev", "yard_build_config/dev", "yard_settings/dev", "http_tour/dev", "dep:toggle_tour", "dep:log"]

[dependencies]
gpui.workspace = true
log = { workspace = true, optional = true }

yard_app = { workspace = true, default-features = false }
yard_shell = { workspace = true, default-features = false }
yard_product = { workspace = true, default-features = false }
yard_settings = { workspace = true, default-features = false, optional = true }
tracing = { workspace = true }

command_palette = { workspace = true, default-features = false }

toggle_tour = { path = "../../examples/toggle_tour", optional = true }
http_tour = { path = "../../examples/http_tour", default-features = false, optional = true }

[dev-dependencies]
serde_json.workspace = true

[build-dependencies]
yard_build_config = { workspace = true, default-features = false }
