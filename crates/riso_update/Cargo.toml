[package]
name = "riso_update"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/riso_update.rs"

[features]
default = ["dev"]
dev = [
    "riso_product/dev",
    "riso_shell/dev",
    "riso_ui/dev",
]

[dependencies]
gpui = { workspace = true }
riso_product = { workspace = true, default-features = false }
riso_shell = { workspace = true, default-features = false }
riso_ui = { workspace = true, default-features = false }
http_client = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
