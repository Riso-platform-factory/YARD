[package]
name = "yard_settings"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/yard_settings.rs"

[features]
default = ["dev"]
dev = ["yard_paths/dev", "dep:schemars"]

[dependencies]
yard_paths = { workspace = true, default-features = false }
gpui.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
tracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
