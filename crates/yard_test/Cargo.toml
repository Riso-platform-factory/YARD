[package]
name = "yard_test"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/yard_test.rs"

[features]
default = ["dev"]
dev = [
    "yard_app/dev",
    "yard_paths/dev",
    "yard_product/dev",
    "yard_settings/dev",
    "yard_shell/dev",
]

[dependencies]
gpui = { workspace = true, features = ["test-support"] }
log.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-core.workspace = true
yard_app = { workspace = true, default-features = false }
yard_paths = { workspace = true, default-features = false }
yard_product = { workspace = true, default-features = false }
yard_shell = { workspace = true, default-features = false }

[dev-dependencies]
serde.workspace = true
yard_settings = { workspace = true, default-features = false }
