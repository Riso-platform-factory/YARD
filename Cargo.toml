[workspace]
resolver = "3"
members = ["crates/*", "app/*", "examples/*"]
default-members = ["app/riso"]

[workspace.package]
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37", default-features = false, features = ["font-kit", "wayland", "x11"] }
ui = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37" }
theme = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37" }
zlog = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37" }
riso_layout = { path = "crates/riso_layout", default-features = false }
riso_shell = { path = "crates/riso_shell", default-features = false }
riso_log = { path = "crates/riso_log", default-features = false }
riso_paths = { path = "crates/riso_paths", default-features = false }
riso_ui = { path = "crates/riso_ui", default-features = false }
riso_settings = { path = "crates/riso_settings", default-features = false }
dirs = "6"
log = "0.4.35"
tracing = "0.1.44"
tracing-log = { version = "0.2", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
libc = "0.2"
tempfile = "3"
toml = "0.9"
