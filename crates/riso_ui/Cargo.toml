[package]
name = "riso_ui"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/riso_ui.rs"

[features]
default = ["dev"]
# Compiles the parts that are not in production.
dev = []

[dependencies]
gpui.workspace = true
theme.workspace = true
ui.workspace = true
serde_json.workspace = true
log.workspace = true
tracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
