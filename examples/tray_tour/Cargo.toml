[package]
name = "tray_tour"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["dev"]
dev = ["dep:gpui", "dep:image", "dep:tracing", "dep:yard_shell", "yard_shell/dev", "dep:yard_ui", "yard_ui/dev"]

[dependencies]
gpui = { workspace = true, optional = true }
image = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
yard_shell = { workspace = true, default-features = false, optional = true }
yard_ui = { workspace = true, default-features = false, optional = true }
