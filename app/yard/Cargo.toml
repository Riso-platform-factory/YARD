[package]
name = "yard"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["dev"]
dev = ["yard_log/dev", "yard_product/dev", "yard_paths/dev", "yard_ui/dev", "yard_layout/dev", "yard_shell/dev", "yard_settings/dev", "yard_keymap/dev", "command_palette/dev", "yard_update/dev", "yard_build_config/dev"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true

yard_layout = { workspace = true, default-features = false }
yard_shell = { workspace = true, default-features = false }
yard_log = { workspace = true, default-features = false }
yard_product = { workspace = true, default-features = false }
yard_paths = { workspace = true, default-features = false }
yard_ui = { workspace = true, default-features = false }
yard_settings = { workspace = true, default-features = false }
yard_keymap = { workspace = true, default-features = false }
tracing = { workspace = true }

command_palette = { workspace = true, default-features = false }

yard_update = { workspace = true, default-features = false }
reqwest_client = { workspace = true }

[dev-dependencies]
semver.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true

[build-dependencies]
semver.workspace = true
toml.workspace = true
yard_build_config = { workspace = true, default-features = false }
