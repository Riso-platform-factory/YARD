[package]
name = "riso"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["dev"]
dev = ["riso_log/dev", "riso_product/dev", "riso_paths/dev", "riso_ui/dev", "riso_layout/dev", "riso_shell/dev", "riso_settings/dev", "riso_keymap/dev", "command_palette/dev", "dep:riso_update", "riso_update/dev", "dep:reqwest_client"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true

riso_layout = { workspace = true, default-features = false }
riso_shell = { workspace = true, default-features = false }
riso_log = { workspace = true, default-features = false }
riso_product = { workspace = true, default-features = false }
riso_paths = { workspace = true, default-features = false }
riso_ui = { workspace = true, default-features = false }
riso_settings = { workspace = true, default-features = false }
riso_keymap = { workspace = true, default-features = false }
tracing = { workspace = true }

command_palette = { workspace = true, default-features = false }

riso_update = { workspace = true, optional = true, default-features = false }
reqwest_client = { workspace = true, optional = true }

[dev-dependencies]
semver.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true

[build-dependencies]
semver.workspace = true
toml.workspace = true
