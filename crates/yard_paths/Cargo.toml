[package]
name = "yard_paths"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/yard_paths.rs"

[features]
default = ["dev"]
# Compiles the parts that are not in production.
dev = ["yard_product/dev"]

[dependencies]
dirs.workspace = true
log.workspace = true
yard_product = { workspace = true, default-features = false }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
