[package]
name = "yard_shell"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/yard_shell.rs"

[features]
default = ["dev"]
dev = [
    "yard_data/dev",
    "yard_http/dev",
    "yard_i18n/dev",
    "yard_layout/dev",
    "yard_paths/dev",
    "yard_product/dev",
    "yard_settings/dev",
    "yard_state/dev",
    "yard_ui/dev",
]

[dependencies]
gpui.workspace = true
yard_data = { workspace = true, default-features = false }
yard_http = { workspace = true, default-features = false }
yard_i18n = { workspace = true, default-features = false }
yard_layout = { workspace = true, default-features = false }
yard_paths = { workspace = true, default-features = false }
yard_product = { workspace = true, default-features = false }
yard_settings = { workspace = true, default-features = false }
yard_state.workspace = true
yard_ui = { workspace = true, default-features = false }
futures.workspace = true
image.workspace = true
log.workspace = true
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true
tracing.workspace = true
url.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit = { workspace = true, features = [
    "std",
    "NSButton",
    "NSCell",
    "objc2-core-foundation",
    "NSControl",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
objc2-core-foundation = { workspace = true, features = [
    "std",
    "CFData",
    "CFDictionary",
    "CFString",
    "CFNumber",
    "CFBase",
    "CFCGTypes",
] }
objc2-security.workspace = true
objc2-foundation = { workspace = true, features = ["std", "NSData", "NSError", "NSProcessInfo", "NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
oo7 = { workspace = true, features = ["async-std", "native_crypto"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
gpui = { workspace = true, features = ["test-support"] }
