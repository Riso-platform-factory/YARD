[package]
name = "command_palette"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/command_palette.rs"

[features]
default = ["dev"]
dev = ["yard_shell/dev", "yard_ui/dev", "yard_test/dev"]

[dependencies]
gpui.workspace = true
yard_shell = { workspace = true, default-features = false }
yard_ui = { workspace = true, default-features = false }
tracing.workspace = true

[dev-dependencies]
log.workspace = true
gpui = { workspace = true, features = ["test-support"] }
yard_test = { workspace = true, default-features = false }
