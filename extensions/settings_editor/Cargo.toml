[package]
name = "settings_editor"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/settings_editor.rs"

[features]
default = ["dev"]
dev = ["dep:gpui", "dep:serde_json", "dep:tracing", "yard_settings/dev", "yard_shell/dev", "yard_ui/dev"]

[dependencies]
gpui = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
yard_settings = { workspace = true, default-features = false, optional = true }
yard_shell = { workspace = true, default-features = false, optional = true }
yard_ui = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
log.workspace = true
schemars.workspace = true
serde.workspace = true
