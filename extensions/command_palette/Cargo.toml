[package]
name = "command_palette"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/command_palette.rs"

[features]
default = ["dev"]
dev = ["riso_shell/dev", "riso_ui/dev"]

[dependencies]
gpui.workspace = true
riso_shell = { workspace = true, default-features = false }
riso_ui = { workspace = true, default-features = false }
tracing.workspace = true

[dev-dependencies]
log.workspace = true
gpui = { workspace = true, features = ["test-support"] }
