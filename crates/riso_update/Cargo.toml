[package]
name = "riso_update"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/riso_update.rs"

[features]
default = ["dev"]
# Compiles the parts that are not in production. No part is in production yet,
# so every dependency comes with `dev`.
dev = [
    "dep:gpui",
    "dep:riso_product",
    "dep:riso_shell",
    "dep:riso_ui",
    "dep:http_client",
    "dep:semver",
    "dep:serde",
    "dep:serde_json",
    "dep:futures",
    "dep:log",
    "dep:tracing",
    "riso_product/dev",
    "riso_shell/dev",
    "riso_ui/dev",
]

[dependencies]
gpui = { workspace = true, optional = true }
riso_product = { workspace = true, optional = true, default-features = false }
riso_shell = { workspace = true, optional = true, default-features = false }
riso_ui = { workspace = true, optional = true, default-features = false }
http_client = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
log = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
