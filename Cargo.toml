[workspace]
resolver = "3"
members = ["app/*"]
default-members = ["app/riso"]

[workspace.package]
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "ddb90e5e89d346f21847281727e1644b8bb2cc37", default-features = false, features = ["font-kit", "wayland", "x11"] }
serde_json = "1"
toml = "0.9"
