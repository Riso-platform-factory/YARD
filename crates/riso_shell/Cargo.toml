[package]
name = "riso_shell"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/riso_shell.rs"

[features]
default = ["dev"]
dev = ["riso_layout/dev", "riso_paths/dev", "riso_settings/dev", "riso_state/dev", "riso_ui/dev"]

[dependencies]
gpui.workspace = true
riso_layout = { workspace = true, default-features = false }
riso_paths = { workspace = true, default-features = false }
riso_settings = { workspace = true, default-features = false }
riso_state.workspace = true
riso_ui = { workspace = true, default-features = false }
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
gpui = { workspace = true, features = ["test-support"] }
