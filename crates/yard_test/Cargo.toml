[package]
name = "yard_test"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/yard_test.rs"

[features]
default = ["dev"]
dev = [
    "dep:gpui",
    "dep:log",
    "dep:serde_json",
    "dep:tempfile",
    "dep:tracing",
    "dep:tracing-core",
    "dep:yard_app",
    "yard_app/dev",
    "dep:yard_paths",
    "yard_paths/dev",
    "dep:yard_product",
    "yard_product/dev",
    "yard_settings/dev",
    "dep:yard_shell",
    "yard_shell/dev",
]

[dependencies]
gpui = { workspace = true, features = ["test-support"], optional = true }
log = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-core = { workspace = true, optional = true }
yard_app = { workspace = true, default-features = false, optional = true }
yard_paths = { workspace = true, default-features = false, optional = true }
yard_product = { workspace = true, default-features = false, optional = true }
yard_shell = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
serde.workspace = true
yard_settings = { workspace = true, default-features = false }
