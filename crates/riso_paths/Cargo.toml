[package]
name = "riso_paths"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/riso_paths.rs"

[features]
default = ["dev"]
# Compiles the parts that are not in production.
dev = ["riso_product/dev"]

[dependencies]
dirs.workspace = true
log.workspace = true
riso_product = { workspace = true, default-features = false }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
