[package]
name = "settings_editor_tour"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["dev"]
dev = ["dep:gpui", "dep:schemars", "dep:serde", "dep:tracing", "dep:yard_settings", "yard_shell/dev"]

[dependencies]
gpui = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
yard_settings = { workspace = true, default-features = false, optional = true }
yard_shell = { workspace = true, default-features = false, optional = true }
